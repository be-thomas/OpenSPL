name: openspl-e2e

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  # Optional reference oracle for SPL parsing. Opt in with:
  #   SPLUNK_PASSWORD=<password> docker compose --profile splunk up -d
  splunk:
    image: splunk/splunk:9.3
    profiles: ["splunk"]
    environment:
      SPLUNK_START_ARGS: --accept-license
      SPLUNK_PASSWORD: ${SPLUNK_PASSWORD:?set SPLUNK_PASSWORD to use the splunk profile}
    ports:
      - "8000:8000"
      - "8089:8089"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://localhost:8089/services/server/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 60
