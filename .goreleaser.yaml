version: 2

project_name: openspl

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: openspl
    main: ./cmd/openspl
    binary: openspl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/be-thomas/openspl/pkg/version.Version={{ .Version }}
      - -X github.com/be-thomas/openspl/pkg/version.Commit={{ .ShortCommit }}
      - -X github.com/be-thomas/openspl/pkg/version.Date={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  draft: false
  prerelease: auto
